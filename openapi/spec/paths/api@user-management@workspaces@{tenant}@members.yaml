get:
  operationId: listManagedWorkspaceMembers
  summary: List workspace members for an instance administrator
  tags: [community, members, namespaces]
  security:
    - jwt: []
  parameters:
    - $ref: ../components/parameters/path/namespaceTenantIDPath.yaml
    - $ref: ../components/parameters/query/pageQuery.yaml
  responses:
    '200':
      description: A page of workspace members.
      content:
        application/json:
          schema:
            type: object
            required: [items, total, per_page]
            properties:
              items:
                type: array
                items:
                  $ref: ../components/schemas/memberView.yaml
              total:
                type: integer
              per_page:
                type: integer
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '503':
      description: Member directory is unavailable.
