name: UI

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    if: ${{ github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            console:
              - 'ui/apps/console/**'
              - 'ui/packages/**'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/eslint.config.js'
              - 'openapi/spec/**'
              - '.github/workflows/validate-ui.yml'
            docs:
              - 'ui/apps/docs/**'
              - 'ui/packages/**'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/eslint.config.js'
              - 'ui/scripts/install-vale.sh'
              - '.github/workflows/validate-ui.yml'
            website:
              - 'ui/apps/website/**'
              - 'ui/packages/**'
              - 'ui/package.json'
              - 'ui/package-lock.json'
              - 'ui/eslint.config.js'
              - '.github/workflows/validate-ui.yml'
            design-system:
              - 'ui/packages/design-system/**'
              - '.github/workflows/validate-ui.yml'
            ui:
              - 'ui/**'
              - 'openapi/spec/**'
              - '.github/workflows/validate-ui.yml'

      - name: Set up Node.js
        if: steps.changes.outputs.ui == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"

      - name: Cache node modules
        if: steps.changes.outputs.ui == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ui/node_modules
          key: ${{ runner.OS }}-ui-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.changes.outputs.ui == 'true'
        id: install
        working-directory: ui
        run: npm install

      - name: Generate OpenAPI client
        if: steps.install.outcome == 'success'
        working-directory: ui
        run: |
          VERSION=$(sed -n 's/^REDOCLY_VERSION=//p' ../versions.env)
          [ -n "$VERSION" ] || { echo "could not read REDOCLY_VERSION from versions.env"; exit 1; }
          npx "@redocly/cli@$VERSION" bundle ../openapi/spec/openapi.yaml -o /tmp/openapi.json --force
          OPENAPI_SPEC_PATH=/tmp/openapi.json npm run generate -w @cloudmatehub/console

      - name: Unused files, exports and dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ui
        run: npm run knip

      - name: Unit test console
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.console == 'true' }}
        working-directory: ui
        run: npm run test -w @cloudmatehub/console

      - name: Lint console
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.console == 'true' }}
        working-directory: ui
        run: npm run lint -w @cloudmatehub/console

      - name: Build console
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.console == 'true' }}
        working-directory: ui
        run: npm run build -w @cloudmatehub/console

      - name: Astro sync docs
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.docs == 'true' }}
        working-directory: ui
        run: npm run sync -w @cloudmatehub/docs

      - name: Install Vale
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.docs == 'true' }}
        run: |
          ./ui/scripts/install-vale.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Unit test docs
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.docs == 'true' }}
        working-directory: ui
        run: npm run test -w @cloudmatehub/docs

      - name: Lint docs
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.docs == 'true' }}
        working-directory: ui
        run: npm run lint -w @cloudmatehub/docs

      - name: Build docs
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.docs == 'true' }}
        working-directory: ui
        run: npm run build -w @cloudmatehub/docs

      - name: Unit test website
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.website == 'true' }}
        working-directory: ui
        run: npm run test -w @cloudmatehub/website

      - name: Lint website
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.website == 'true' }}
        working-directory: ui
        run: npm run lint -w @cloudmatehub/website

      - name: Build website
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.website == 'true' }}
        working-directory: ui
        run: npm run build -w @cloudmatehub/website

      - name: Unit test design-system
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.design-system == 'true' }}
        working-directory: ui
        run: npm run test -w @cloudmatehub/design-system

      - name: Lint design-system
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.design-system == 'true' }}
        working-directory: ui
        run: npm run lint -w @cloudmatehub/design-system

  ui:
    name: ui
    needs: [validate]
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
      - name: Fail when a UI job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
