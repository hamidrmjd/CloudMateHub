name: Publish CloudMateHub images

on:
  push:
    branches: [main]
    paths: [.env]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudmatehub-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hamidrmjd/CloudMateHub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: hamidrazavi000
          password: ${{ secrets.CLOUDMATEHUB_DOCKERHUB_TOKEN }}
      - name: Publish images and mark the release ready
        run: |
          set -euo pipefail
          tag="v$(sed -n 's/^CLOUDMATEHUB_VERSION=//p' .env)"
          published=$(git ls-remote --refs origin "refs/tags/cloudmatehub-$tag")
          if [ -n "$published" ]; then
            echo "CloudMateHub $tag is already released."
            exit 0
          fi
          cp deployments/ubuntu/env.example .env.override
          sed -i '/^CLOUDMATEHUB_IMAGE_COMPOSE_FILE=/d' .env.override
          python3 deployments/publish-dockerhub.py hamidrazavi000 --platforms linux/amd64 --tag "$tag"
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com tag -a "cloudmatehub-$tag" -m "CloudMateHub $tag"
          git push origin "refs/tags/cloudmatehub-$tag"
