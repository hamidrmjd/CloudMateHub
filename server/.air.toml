root = "../../"
tmp_dir = "/tmp/air"

[build]
cmd = "go build -o /tmp/air/main github.com/shellhub-io/shellhub/server"
bin = "/tmp/air/main"
args_bin = ["server"]
exclude_regex = ["_test.go"]
include_dir = ["cloudmatehub/server", "cloudmatehub/openapi", "cloudmatehub/pkg", "cloud"]
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
