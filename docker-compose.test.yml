version: "3.7"

x-e2e-labels: &e2e-labels
  io.cloudmatehub.e2e.run: ${SHELLHUB_E2E_RUN:?}
  io.cloudmatehub.e2e.lease: ${SHELLHUB_E2E_LEASE:-}
  io.cloudmatehub.e2e.kind: ${SHELLHUB_E2E_KIND:-}
  io.cloudmatehub.e2e.expires: ${SHELLHUB_E2E_EXPIRES:-}
  io.cloudmatehub.e2e.checkout: ${SHELLHUB_E2E_CHECKOUT:-}

services:
  server:
    image: cloudmatehub-e2e/server:${SHELLHUB_E2E_RUN:?}-${SHELLHUB_BUILD_EDITION:-community}
    labels: *e2e-labels
    pull_policy: never
    restart: on-failure:3
    healthcheck:
      interval: 5s
      start_period: 10s
      retries: 20
    ports: []
    environment:
      - SHELLHUB_OPENAPI_VALIDATION=strict
      - SHELLHUB_OPENAPI_SCHEMA=file:///etc/cloudmatehub/openapi.json
      - SHELLHUB_LOG_FORMAT=text
      - SHELLHUB_SESSION_RETENTION_DAYS=${SHELLHUB_SESSION_RETENTION_DAYS:-0}
    volumes:
      - ./openapi/static/openapi-${SHELLHUB_EDITION:-community}.json:/etc/cloudmatehub/openapi.json:ro
  gateway:
    image: cloudmatehub-e2e/gateway:${SHELLHUB_E2E_RUN:?}
    labels: *e2e-labels
    pull_policy: never
    restart: on-failure:3
    healthcheck:
      interval: 5s
      start_period: 10s
      retries: 20
    ports: []
  ui:
    image: cloudmatehub-e2e/ui:${SHELLHUB_E2E_RUN:?}
    labels: *e2e-labels
    pull_policy: never
    restart: on-failure:3
    healthcheck:
      interval: 5s
      start_period: 10s
      retries: 20
  redis:
    labels: *e2e-labels
    ports:
      - ${SHELLHUB_BIND_ADDRESS}:${SHELLHUB_TEST_REDIS_PORT:-0}:6379
