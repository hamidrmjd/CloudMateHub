x-e2e-labels: &e2e-labels
  io.cloudmatehub.e2e.run: ${SHELLHUB_E2E_RUN:?}
  io.cloudmatehub.e2e.lease: ${SHELLHUB_E2E_LEASE:-}
  io.cloudmatehub.e2e.kind: ${SHELLHUB_E2E_KIND:-}
  io.cloudmatehub.e2e.expires: ${SHELLHUB_E2E_EXPIRES:-}
  io.cloudmatehub.e2e.checkout: ${SHELLHUB_E2E_CHECKOUT:-}

services:
  redis:
    image: valkey/valkey:9.1-alpine
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    labels: *e2e-labels
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      start_period: 10s
      retries: 20
  server:
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ${SHELLHUB_LICENSE_FILE:-/dev/null}:/etc/cloudmatehub/license.dat:ro
    environment:
      - ADMIN_API_LICENSE_FILE=${SHELLHUB_LICENSE_FILE:+/etc/cloudmatehub/license.dat}
