# Pull published CloudMateHub images without local source builds.
services:
  server:
    image: ${CLOUDMATEHUB_DOCKERHUB_NAMESPACE:-hamid001}/cloudmatehub-server:${CLOUDMATEHUB_IMAGE_TAG:-latest}
    build: !reset null
  ui:
    image: ${CLOUDMATEHUB_DOCKERHUB_NAMESPACE:-hamid001}/cloudmatehub-ui:${CLOUDMATEHUB_IMAGE_TAG:-latest}
    build: !reset null
  gateway:
    image: ${CLOUDMATEHUB_DOCKERHUB_NAMESPACE:-hamid001}/cloudmatehub-gateway:${CLOUDMATEHUB_IMAGE_TAG:-latest}
    build: !reset null
  https-manager:
    image: ${CLOUDMATEHUB_DOCKERHUB_NAMESPACE:-hamid001}/cloudmatehub-https-manager:${CLOUDMATEHUB_IMAGE_TAG:-latest}
    build: !reset null
  wgdashboard:
    image: ${CLOUDMATEHUB_DOCKERHUB_NAMESPACE:-hamid001}/cloudmatehub-wgdashboard:${CLOUDMATEHUB_IMAGE_TAG:-latest}
    build: !reset null
  vpn-broker:
    image: ${CLOUDMATEHUB_DOCKERHUB_NAMESPACE:-hamid001}/cloudmatehub-wgdashboard:${CLOUDMATEHUB_IMAGE_TAG:-latest}
    build: !reset null
